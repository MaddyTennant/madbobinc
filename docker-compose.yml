services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madbob
      POSTGRES_PASSWORD: madbob
      POSTGRES_DB: madbob_spend
    ports:
      - "5432:5432"
    volumes:
      - madbob_pgdata:/var/lib/postgresql/data

volumes:
  madbob_pgdata:
